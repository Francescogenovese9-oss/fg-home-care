name: DIRECT validation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/direct-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: DIRECT regression tests
        run: node --experimental-strip-types --test tests/direct-routing.test.mjs
      - name: Lint (continue to build for diagnostics)
        id: lint
        continue-on-error: true
        run: |
          npx eslint "app/api/appointments/route.ts" "app/api/payments/create-intent/route.ts" "app/api/payments/preview/route.ts" "app/api/payments/refund/route.ts" "app/api/payments/refund-preview/route.ts" "app/api/professional/appointments/[appointmentId]/cancel/route.ts" "app/api/reviews/route.ts" "lib/appointments/remind-completion.ts" "app/api/appointments/[appointmentId]/video/route.ts" "app/dashboard/professional/appointments/page.tsx" "app/api/professional/appointments/[appointmentId]/status/route.ts" "app/api/stripe/subscription/direct/checkout/route.ts" "app/carta-dei-servizi/page.tsx" "app/dashboard/patient/appointments/[appointmentId]/payment/page.tsx" "app/dashboard/patient/appointments/page.tsx" "app/dashboard/professional/payments/page.tsx" "app/privacy/page.tsx" "app/termini-e-condizioni/page.tsx" "components/auth/RegisterForm.tsx" "components/payments/ProfessionalSubscriptionCard.tsx" "lib/email/templates/appointment-accepted.ts" "lib/payments/service-payment-route.ts" "lib/stripe/sync-professional-subscription.ts" "lib/subscriptions/direct-plan.ts"
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_TRANSACTIONS_ENABLED: "false"
          FG_DIRECT_PLAN_ENABLED: "false"
      - name: Enforce lint and build success
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
