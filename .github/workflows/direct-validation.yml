name: DIRECT validation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/direct-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Lint (continue to build for diagnostics)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        id: build
        continue-on-error: true
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_TRANSACTIONS_ENABLED: "false"
          FG_DIRECT_PLAN_ENABLED: "false"
      - name: Enforce lint and build success
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
